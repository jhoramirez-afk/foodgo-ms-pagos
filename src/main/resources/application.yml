spring:
  application:
    name: pagos-svc
  profiles:
    default: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8084}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

# El perfil eureka habilita el registro. Test/H2/MySQL independientes siguen disponibles.
eureka:
  client:
    enabled: false
