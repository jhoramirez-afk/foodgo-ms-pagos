name: "foodgo-pagos-postgres"
services:
  postgres:
    image: "postgres:18"
    environment:
      POSTGRES_DB: "foodgo_pagos"
      POSTGRES_USER: "${DB_USER:-foodgo_ep02}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Definir DB_PASSWORD en el archivo de entorno}"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-54324}:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql"
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h127.0.0.1 -U\"$${POSTGRES_USER}\" -d\"$${POSTGRES_DB}\" -tAc \"SELECT 1\" >/dev/null 2>&1"
      interval: "5s"
      timeout: "5s"
      start_period: "45s"
      retries: 30
    restart: "unless-stopped"
    stop_grace_period: "45s"
  app:
    build:
      context: "."
      dockerfile: "Dockerfile"
    image: "foodgo/pagos:ep02-postgres"
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-postgres}"
      EUREKA_URL: "${EUREKA_URL:-http://host.docker.internal:8761/eureka/}"
      EUREKA_PREFER_IP_ADDRESS: "true"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "foodgo_pagos"
      DB_USER: "${DB_USER:-foodgo_ep02}"
      DB_PASSWORD: "${DB_PASSWORD:?Definir DB_PASSWORD en el archivo de entorno}"
      PORT: "8084"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m"
    depends_on:
      postgres:
        condition: "service_healthy"
    ports:
      - "127.0.0.1:${APP_PORT:-18084}:8084"
    restart: "unless-stopped"
    stop_grace_period: "30s"
volumes:
  postgres_data: {}
