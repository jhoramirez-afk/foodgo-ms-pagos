name: CI

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build y tests (con cobertura JaCoCo)
        run: |
          for intento in 1 2 3; do
            set +e
            mvn -B -U verify 2>&1 | tee maven-build.log
            resultado=${PIPESTATUS[0]}
            set -e
            if [ "$resultado" -eq 0 ]; then
              exit 0
            fi
            if ! grep -qE 'status code: 429|Too Many Requests \(429\)' maven-build.log; then
              exit "$resultado"
            fi
            if [ "$intento" -eq 3 ]; then
              exit "$resultado"
            fi
            echo "Maven Central limita la descarga (429); reintento $intento de 2."
            sleep $((intento * 30))
          done

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Publicar reporte Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber/

      - name: Publicar JAR validado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foodgo-jar
          path: target/*.jar
          if-no-files-found: error
